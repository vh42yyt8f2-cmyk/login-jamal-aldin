<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | جمال الدين عبد الله يوسف</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
        }

        .login-card{
            width:400px;
            background:#1a1a1a;
            padding:35px;
            border-radius:18px;
            box-shadow:0 15px 40px rgba(0,0,0,.5);
            color:#fff;
            text-align:center;
            animation:fadeIn .8s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(-20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#10b981;
            color:#fff;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0 auto 20px;
            font-size:38px;
        }

        h2{
            color:#10b981;
            margin-bottom:8px;
        }

        p{
            color:#bdbdbd;
            margin-bottom:25px;
        }

        .input-group{
            text-align:right;
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            color:#eee;
        }

        .input-box{
            display:flex;
            align-items:center;
            background:#fff;
            border-radius:8px;
            overflow:hidden;
        }

        .input-box i{
            color:#10b981;
            width:45px;
            text-align:center;
        }

        .input-box input{
            flex:1;
            border:none;
            outline:none;
            padding:14px;
            font-size:15px;
        }

        .show-btn{
            border:none;
            background:none;
            cursor:pointer;
            color:#555;
            padding:0 15px;
            font-size:16px;
        }

        .login-btn{
            width:100%;
            padding:14px;
            background:#10b981;
            color:#fff;
            border:none;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .login-btn:hover{
            background:#059669;
        }

        #error-msg{
            display:none;
            margin-top:15px;
            color:#ff4d4d;
            font-size:14px;
        }

        #welcome-section{
            display:none;
            text-align:right;
        }

        #welcome-section h1{
            text-align:center;
            color:#10b981;
            margin-bottom:25px;
        }

        .info-box{
            background:#262626;
            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
            border-right:4px solid #10b981;
        }

        .info-box span{
            color:#10b981;
            font-weight:bold;
        }

        .thank-you{
            text-align:center;
            margin-top:20px;
            color:#cfcfcf;
            font-style:italic;
        }
    </style>
</head>

<body>

<!-- صفحة تسجيل الدخول -->
<div class="login-card" id="login-card">

    <div class="logo">
        <i class="fa-solid fa-user"></i>
    </div>

    <h2>جمال الدين عبد الله يوسف</h2>
    <p>تسجيل الدخول إلى حسابك</p>

    <form onsubmit="checkLogin(event)">

        <div class="input-group">
            <label>اسم المستخدم</label>

            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input
                    type="text"
                    id="username"
                    placeholder="أدخل اسم المستخدم"
                    required>
            </div>
        </div>

        <div class="input-group">
            <label>كلمة المرور</label>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    required>

                <button
                    type="button"
                    class="show-btn"
                    onclick="togglePassword()">

                    <i class="fa-solid fa-eye"></i>

                </button>
            </div>
        </div>

        <button class="login-btn">
            <i class="fa-solid fa-right-to-bracket"></i>
            تسجيل الدخول
        </button>

        <p id="error-msg">
            اسم المستخدم أو كلمة المرور غير صحيحة.
        </p>

    </form>

</div>

<!-- الصفحة الثانية -->

<div class="login-card" id="welcome-section">

    <h1>بيانات الحساب</h1>

    <div class="info-box">
        <span>الكلية:</span>
        كلية النصر التقنية
    </div>

    <div class="info-box">
        <span>الاسم:</span>
        جمال الدين عبد الله يوسف
    </div>

    <div class="info-box">
        <span>التخصص:</span>
        تقنية المعلومات
    </div>

    <div class="info-box">
        <span>نوع الحساب:</span>
        حساب شخصي
    </div>

    <div class="info-box">
        <span>اسم المستخدم:</span>
        jamal
    </div>

    <p class="thank-you">
        شكرًا لحسن المتابعة.
    </p>

    <button class="login-btn" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        تسجيل الخروج
    </button>

</div>

<script>

function checkLogin(event){

    event.preventDefault();

    document.getElementById("error-msg").style.display="none";

    let user=document.getElementById("username").value.trim();
    let pass=document.getElementById("password").value.trim();

    if(user==="jamal" && pass==="1234"){

        document.getElementById("login-card").style.display="none";

        document.getElementById("welcome-section").style.display="block";

    }else{

        document.getElementById("error-msg").style.display="block";

    }

}

function togglePassword(){

    let pass=document.getElementById("password");

    if(pass.type==="password"){

        pass.type="text";

    }else{

        pass.type="password";

    }

}

function logout(){

    location.reload();

}

</script>

</body>
</html>
