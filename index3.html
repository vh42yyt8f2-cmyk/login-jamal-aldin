<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة تسجيل الدخول - جمال الدين</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #555;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background-color: #1a1a1a;
            width: 380px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: #fff;
        }

        .login-card h2 {
            color: #00f5a0;
            font-size: 26px;
            margin-bottom: 5px;
        }

        .login-card p {
            color: #b0b0b0;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: right;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #e0e0e0;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background-color: #059669;
        }

        #error-msg {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        /* تنسيق الصفحة الثانية (المخصصة) */
        #welcome-section {
            display: none;
            text-align: right;
            color: #fff;
        }

        #welcome-section h1 {
            color: #00f5a0;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .info-box {
            background-color: #262626;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-right: 4px solid #00f5a0;
        }

        .info-box span {
            color: #00f5a0;
            font-weight: bold;
        }

        .thank-you {
            text-align: center;
            color: #b0b0b0;
            font-size: 14px;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- نموذج تسجيل الدخول -->
    <div class="login-card" id="login-card">
        <h2>جمال الدين عبدالله</h2>
        <p>صفحة تسجيل الدخول</p>

        <form id="loginForm" onsubmit="checkLogin(event)">
            <div class="input-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit" class="login-btn">تسجيل الدخول</button>
            <p id="error-msg">اسم المستخدم أو كلمة المرور غير صحيحة!</p>
        </form>
    </div>

    <!-- الصفحة الثانية التي تظهر بعد نجاح الدخول -->
    <div class="login-card" id="welcome-section">
        <h1>معلومات الحساب</h1>
        
        <div class="info-box">
            <span>الكلية:</span> كلية النصر التقنية
        </div>
        
        <div class="info-box">
            <span>الاسم:</span> جمال الدين عبدالله يوسف
        </div>
        
        <div class="info-box">
            <span>التخصص:</span> تقنية معلومات
        </div>
        
        <div class="info-box">
            <span>نوع الحساب:</span> حساب شخصي
        </div>

        <p class="thank-you">وشكرا لحسن المتابعة</p>

        <button class="login-btn" style="margin-top: 20px;" onclick="location.reload()">تسجيل الخروج</button>
    </div>

    <script>
        function checkLogin(event) {
            event.preventDefault(); // منع إعادة تحميل الصفحة

            var user = document.getElementById('username').value;
            var pass = document.getElementById('password').value;

            // التحقق من اسم المستخدم jamal وكلمة المرور 1234
            if (user === "jamal" && pass === "1234") {
                // إخفاء صفحة تسجيل الدخول وإظهار الصفحة الثانية
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('welcome-section').style.display = 'block';
            } else {
                // إظهار رسالة الخطأ إذا كانت البيانات خطأ
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>

</body>
</html>
