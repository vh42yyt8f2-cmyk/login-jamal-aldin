<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background-image:
            linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
            url("background.jpg");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }

        .box{
            width:90%;
            max-width:400px;
            background:rgba(0,0,0,.75);
            padding:35px;
            border-radius:20px;
            color:#fff;
            box-shadow:0 10px 30px rgba(0,0,0,.5);
        }

        .name{
            text-align:center;
            font-size:26px;
            color:#00ff99;
            font-weight:bold;
            margin-bottom:8px;
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#ddd;
            font-size:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:16px;
        }

        input{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            margin-bottom:18px;
            font-size:16px;
            outline:none;
        }

        input:focus{
            border:2px solid #16a34a;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#16a34a;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#15803d;
        }

        .footer{
            text-align:center;
            margin-top:15px;
            color:#ccc;
            font-size:14px;
        }
    </style>

</head>

<body>

<div class="box">

    <div class="name">جمال الدين</div>

    <h2>صفحة تسجيل الدخول</h2>

    <form action="#" method="post">

        <label for="username">اسم المستخدم</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="أدخل اسم المستخدم"
            autocomplete="username"
            required>

        <label for="password">كلمة المرور</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
            required>

        <button type="submit">تسجيل الدخول</button>

    </form>

    <div class="footer">
        جميع الحقوق محفوظة © 2026
    </div>

</div>

</body>
</html>
