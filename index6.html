<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة تسجيل الدخول</title>
    <!-- استدعاء مكتبة Bootstrap 5 (RTL) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-secondary d-flex justify-content-center align-items-center vh-100 m-0">

    <div class="card bg-dark text-light p-4 shadow-lg border-0 rounded-4" style="width: 360px;">
        <div class="card-body text-center p-2">
            <h1 class="text-success fs-2 fw-bold mb-2">جمال الدين عبدالله</h1>
            <h2 class="text-white-50 fs-6 mb-4">صفحة تسجيل الدخول</h2>

            <form>
                <div class="mb-3 text-end">
                    <label for="username" class="form-label text-white-50 small">اسم المستخدم</label>
                    <input type="text" id="username" class="form-control bg-black text-light border-secondary" placeholder="أدخل اسم المستخدم">
                </div>

                <div class="mb-4 text-end">
                    <label for="password" class="form-label text-white-50 small">كلمة المرور</label>
                    <input type="password" id="password" class="form-control bg-black text-light border-secondary" placeholder="أدخل كلمة المرور">
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold mb-3">تسجيل الدخول</button>
            </form>

            <p class="text-white-50 small mb-0">افتحر بروحي © 2026</p>
        </div>
    </div>

    <!-- استدعاء جافاسكريبت Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
